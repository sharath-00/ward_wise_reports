name: BBMP Central Zone Voltage Interval Analysis

on:
  # 1. Trigger via Repository API Dispatch: POST /repos/{owner}/{repo}/dispatches
  repository_dispatch:
    types:
      - send_all_reports
      - voltage_interval_analysis
      - voltage_analysis
      - track_voltage
      - voltage_tracker
      - voltage_interval_check

  # 2. Trigger manually via GitHub Actions Web UI or REST API
  workflow_dispatch:
    inputs:
      zone:
        description: "Target Zone ('all', 'cv_raman_nagar', 'sarvagna_nagar', 'shanthi_nagar', 'shivaji_nagar')"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "cv_raman_nagar"
          - "sarvagna_nagar"
          - "shanthi_nagar"
          - "shivaji_nagar"
      send_only_on_change:
        description: "Send alert only if new voltage anomalies or recoveries occurred"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Reset previous baseline state before analyzing"
        required: false
        default: false
        type: boolean

  # 3. Scheduled triggers: Hourly during operational hours & morning status check
  schedule:
    - cron: "30 3 * * *"      # 09:00 AM IST (Morning Status Check)
    - cron: "0 13-17 * * *"   # 18:30, 19:30, 20:30, 21:30, 22:30 IST (Evening Interval Tracking)

jobs:
  run-voltage-interval-analysis:
    name: Execute Voltage Interval Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore historical Voltage state snapshot across runs to calculate deltas
      - name: Restore Voltage State Cache
        id: state-cache
        uses: actions/cache@v4
        with:
          path: voltage_interval_tracker/voltage_state.json
          key: voltage-state-${{ github.run_id }}
          restore-keys: |
            voltage-state-

      - name: Determine Run Parameters
        id: opts
        run: |
          TARGET_ZONE="${{ github.event.inputs.zone || github.event.client_payload.zone || 'all' }}"
          SEND_CHANGE_ONLY="${{ github.event.inputs.send_only_on_change || github.event.client_payload.send_only_on_change || 'false' }}"
          RESET_STATE="${{ github.event.inputs.reset_state || github.event.client_payload.reset_state || 'false' }}"
          echo "selected_zone=$TARGET_ZONE" >> $GITHUB_OUTPUT
          echo "send_change_only=$SEND_CHANGE_ONLY" >> $GITHUB_OUTPUT
          echo "reset_state=$RESET_STATE" >> $GITHUB_OUTPUT

      - name: Run Voltage Interval Analysis & Dispatch Alert
        env:
          THINGSBOARD_BASE_URL: ${{ secrets.THINGSBOARD_BASE_URL || 'https://schnelliot.in' }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          VOLTAGE_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.VOLTAGE_GOOGLE_CHAT_WEBHOOK_URL || secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ steps.opts.outputs.send_change_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --send-only-on-change"
          fi
          if [ "${{ steps.opts.outputs.reset_state }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --reset-state"
          fi
          python voltage_interval_tracker/main_voltage_tracker.py --zone "${{ steps.opts.outputs.selected_zone }}" --send $EXTRA_ARGS

      # Save updated Voltage state snapshot for the next interval run
      - name: Save Updated Voltage State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: voltage_interval_tracker/voltage_state.json
          key: voltage-state-${{ github.run_id }}
