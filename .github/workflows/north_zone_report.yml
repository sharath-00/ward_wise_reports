name: BBMP North Zone Telemetry Health Report

on:
  # 1. Trigger via Repository API Dispatch: POST /repos/{owner}/{repo}/dispatches
  repository_dispatch:
    types: [send_all_reports, send_north_zone_report, trigger_north_zone_report, north_zone_report]

  # 2. Trigger manually via GitHub Actions Web UI or REST API
  workflow_dispatch:
    inputs:
      zone:
        description: "Target Zone ('all', 'sarvagna_nagar', 'hebbal', 'pulakesi_nagar')"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "sarvagna_nagar"
          - "hebbal"
          - "pulakesi_nagar"

  # 3. Scheduled triggers (09:00 AM IST + Evening Hourly 6 PM - 11 PM IST)
  schedule:
    - cron: "30 3 * * *"     # 09:00 AM IST
    - cron: "30 12-17 * * *" # 18:00, 19:00, 20:00, 21:00, 22:00, 23:00 IST

jobs:
  run-north-zone-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Target Zone
        id: zone-selector
        run: |
          # Priority: workflow_dispatch input > repository_dispatch payload > default 'all'
          TARGET_ZONE="${{ github.event.inputs.zone }}"
          if [ -z "$TARGET_ZONE" ]; then
            TARGET_ZONE="${{ github.event.client_payload.zone }}"
          fi
          if [ -z "$TARGET_ZONE" ]; then
            TARGET_ZONE="all"
          fi
          echo "selected_zone=$TARGET_ZONE" >> $GITHUB_OUTPUT
          echo "Selected target zone: $TARGET_ZONE"

      - name: Execute and Send North Zone Telemetry Report
        env:
          THINGSBOARD_BASE_URL: ${{ secrets.THINGSBOARD_BASE_URL || 'https://schnelliot.in' }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          NORTH_ZONE_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.NORTH_ZONE_GOOGLE_CHAT_WEBHOOK_URL }}
          ZONES_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.ZONES_GOOGLE_CHAT_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          python north_zone_report/main_north_zone.py --zone "${{ steps.zone-selector.outputs.selected_zone }}" --send
