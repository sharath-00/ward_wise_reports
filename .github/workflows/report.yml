name: BBMP Ward Panel Health Report

on:
  # 1. Trigger via Repository API Dispatch: POST /repos/{owner}/{repo}/dispatches
  repository_dispatch:
    types: [send_all_reports, send_ward_report, ward_report, send_report, trigger_report, bbmp_report]

  # 2. Trigger manually via GitHub Web UI or GitHub Actions REST API
  workflow_dispatch:
    inputs:
      ward:
        description: "Target Ward ('all', '167', or '118')"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "167"
          - "118"

  # 3. Scheduled triggers (Optional daily runs: 03:30 UTC = 09:00 AM IST, 12:30 UTC = 06:00 PM IST)
  schedule:
    - cron: "30 3 * * *"   # 09:00 AM IST
    - cron: "30 12 * * *"  # 06:00 PM IST

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Target Ward
        id: ward-selector
        run: |
          # Priority: workflow_dispatch input > repository_dispatch payload > default 'all'
          TARGET_WARD="${{ github.event.inputs.ward }}"
          if [ -z "$TARGET_WARD" ]; then
            TARGET_WARD="${{ github.event.client_payload.ward }}"
          fi
          if [ -z "$TARGET_WARD" ]; then
            TARGET_WARD="all"
          fi
          echo "selected_ward=$TARGET_WARD" >> $GITHUB_OUTPUT
          echo "Selected target ward: $TARGET_WARD"

      - name: Execute and Send Ward Panel Health Report
        env:
          THINGSBOARD_BASE_URL: ${{ secrets.THINGSBOARD_BASE_URL || 'https://schnelliot.in' }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          python main.py --ward "${{ steps.ward-selector.outputs.selected_ward }}" --send
